name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          # openai-whisper's setup.py needs an older setuptools and no build
          # isolation to build cleanly — same workaround as backend/Dockerfile.
          pip install "setuptools<71" wheel
          pip install --no-build-isolation openai-whisper==20240930
          pip install -r requirements.txt

      - name: Run backend test suite
        run: pytest tests/ -q

  backend-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install backend dependencies
        run: |
          # Same build workaround as the test job — pip-audit resolves/builds
          # requirements.txt too, and openai-whisper needs this to build cleanly.
          pip install "setuptools<71" wheel
          pip install --no-build-isolation openai-whisper==20240930
          pip install -r requirements.txt

      - name: Audit installed Python dependencies for known vulnerabilities
        run: pip-audit --strict
        continue-on-error: true # advisory for now — don't block merges on transitive CVEs

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Audit frontend dependencies for known vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true # advisory for now — don't block merges on transitive CVEs
